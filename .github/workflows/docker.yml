name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build & test de l'image Docker ─────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image (cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: lotr-soundboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and exits cleanly
        run: |
          docker run --rm \
            -e SDL_AUDIODRIVER=dummy \
            -e SDL_VIDEODRIVER=offscreen \
            -e QT_QPA_PLATFORM=offscreen \
            lotr-soundboard:test \
            python3 -c "
          import ast, os
          ast.parse(open('soundboard.py').read())
          wavs = [f for r,_,fs in os.walk('sounds') for f in fs if f.endswith('.wav')]
          print(f'[OK] syntax valid, {len(wavs)} audio files in image')
          assert len(wavs) >= 35, f'Expected >=35 WAV, got {len(wavs)}'
          "

      - name: Build & push (on merge to main or tag)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Scan de sécurité de l'image ─────────────────────────────────────────────
  scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: lotr-soundboard:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lotr-soundboard:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"  # warn, don't fail

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
